services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg
      POSTGRES_DB: mtg_deck_builder
    ports:
      - "5432:5432"
    volumes:
      - mtg-deck-builder-db:/var/lib/postgresql/data

volumes:
  mtg-deck-builder-db:
